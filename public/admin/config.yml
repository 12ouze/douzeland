# Configuration Decap CMS — interface d'admin de douzeland.
# Auth : GitHub OAuth auto-hébergé (Cloudflare Pages Functions : /api/auth + /api/callback).
# Pour éditer en LOCAL sans OAuth : ajouter temporairement `local_backend: true`
# ici + lancer `npx decap-server` — et NE PAS commiter ce réglage (c'est un
# mode de développement, il n'a rien à faire en production).

backend:
  name: github
  repo: 12ouze/douzeland
  branch: main
  # ⚠️ base_url reste sur pages.dev VOLONTAIREMENT : c'est l'hôte dont
  # l'origine sert de redirect_uri OAuth, et le callback déclaré dans l'app
  # GitHub est https://douzeland.pages.dev/api/callback. Le passer à
  # douzeland.com sans changer le callback chez GitHub casserait la
  # connexion à l'admin (cf. CLAUDE.md → Callback OAuth lié au domaine).
  base_url: https://douzeland.pages.dev        # hôte des fonctions OAuth (Cloudflare Pages)
  auth_endpoint: api/auth                       # Pages Function → /api/auth

# Cosmétique (lien « voir le site » dans l'admin) : sans lien avec l'OAuth.
site_url: https://douzeland.com
locale: fr

# Images commitées dans src/assets/photos (optimisées par Astro au build) ;
# le chemin écrit dans le .md reste au format relatif actuel (../../assets/photos/x).
media_folder: "src/assets/photos"
public_folder: "../../assets/photos"

collections:
  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    description: "Une photo = un .md + son image. Le slug vient du nom de fichier."
    folder: "src/content/photos"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{year}}-{{month}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    # Syntaxe Decap valide (cf. schéma de decap-cms 3.12.2) : array dont UN
    # item objet porte default_sort. Ici l'admin s'ouvre trié par order desc.
    sortable_fields:
      - { field: order, default_sort: desc }
      - date
      - title
    fields:
      - { label: "Titre", name: "title", widget: "string", required: false }
      - { label: "Ordre d'affichage", name: "order", widget: "order_quick", value_type: "int", required: true, hint: "Utilise les boutons (⏫ ↑ ↓ ⏬) pour réordonner, ou saisis un nombre. Plus grand = affiché plus haut." }
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "À la une (hero)", name: "featured", widget: "boolean", default: false }
      - { label: "Afficher dans le carrousel", name: "in_slider", widget: "boolean", required: false, default: false }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Texte alternatif (alt)", name: "alt", widget: "string" }
      - { label: "Texte libre (optionnel)", name: "body", widget: "markdown", required: false }
