<!--
  Monogramme « 12 » — favicon douzeland.
  Carré crème #f7f5ef, chiffres noir #111, coins francs.

  Les chiffres sont des tracés géométriques (arcs + segments), pas du <text> :
  aucune police n'est nécessaire côté visiteur, le rendu est identique partout.

  Grille : le viewBox fait 64 unités, donc 4 unités = 1 pixel à l'affichage
  16 px. Les traits droits (hampe du « 1 », barre du « 2 », haut et bas des
  chiffres) tombent sur des multiples de 4 pour rester nets à cette taille.
  Toute retouche de ces valeurs doit rester sur ce pas de 4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#f7f5ef"/>
  <g fill="none" stroke="#111" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- « 1 » : hampe puis attaque oblique -->
    <path d="M16 8 V56"/>
    <path d="M16 11.5 L7 18"/>
    <!-- « 2 » : boucle haute prolongée par la diagonale -->
    <path d="M28.84 30.79 A14 14 0 1 1 56 26 L30 52"/>
    <!-- « 2 » : barre du bas -->
    <path d="M24 52 H60"/>
  </g>
</svg>
